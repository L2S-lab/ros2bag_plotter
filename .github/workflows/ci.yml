name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]
        ros-distro: ["humble", "jazzy", "kilted", "lyrical", "rolling"]

    env:
      ROS_DISTRO: ${{ matrix.ros-distro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check src tests --select F,E9

      - name: Run tests
        run: pytest -q

      - name: Build package
        if: matrix.python-version == '3.11' && matrix.ros-distro == 'humble'
        run: python -m build